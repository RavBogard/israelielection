name: Count capture (browser relay backup)
# Backup for scripts/live-count/capture.mts on the operator machine: the CEC count files sit behind an AWS WAF
# challenge that only a browser passes. One headless capture per run, written through the same count-store path.
# Secrets: KV_REST_API_URL, KV_REST_API_TOKEN (production count store). Optional QSTASH_URL, QSTASH_TOKEN to
# trigger the forecast and lifecycle refresh at once; without them the next scheduled cycle reads the stored count.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and log only, write nothing
        type: boolean
        default: false
  schedule:
    - cron: "*/5 20-23 27 10 *"
    - cron: "*/5 * 28 10 *"
    - cron: "*/5 0-23 29 10 *"
    # Envelope votes finish by Thu 29 Oct and the official result is expected about 3-5 Nov: hourly from the 30th to the end of the window.
    - cron: "0 * 30-31 10 *"
    - cron: "0 * 1-7 11 *"
# The window comes from data/election.json (pollsClose to countWindowEnd), the one election config.
concurrency:
  group: count-capture
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Bound automatic runs to the count window
        id: window
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          now=$(date -u +%s)
          start=$(date -u -d "$(jq -r .pollsClose data/election.json)" +%s)
          end=$(date -u -d "$(jq -r .countWindowEnd data/election.json)" +%s)
          if [ "$now" -ge "$start" ] && { [ "$MANUAL" = 'true' ] || [ "$now" -lt "$end" ]; }; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and Chromium
        if: steps.window.outputs.allowed == 'true'
        run: |
          npm install --no-audit --no-fund  # not `npm ci`: lockfiles written on Windows drop Linux-only optional deps (npm bug)
          npx playwright install --with-deps chromium
      - name: Capture once
        if: steps.window.outputs.allowed == 'true'
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          ELECTION_LIFECYCLE_NAMESPACE: production
          VERCEL_ENV: production
          LIVE_FORECAST_WORKER_URL: https://www.israelielection.org/api/live-forecast/worker
          ELECTION_LIFECYCLE_WORKER_URL: https://www.israelielection.org/api/election-lifecycle/worker
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npx tsx scripts/live-count/capture.mts --target production --once $DRY_RUN
