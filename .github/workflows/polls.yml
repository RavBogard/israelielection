name: Polls

# Twice a day: import new polls from Wikipedia. Polls that pass the validator are committed to
# main (Vercel redeploys). Polls that fail go to one rolling review PR assigned to Daniel.
# Election-night acquisition is coordinated by signed QStash cycles; no independent10-minute importer.
# Fallback by hand: Run workflow with a pollster and its seats (scripts/jobs/add-exit-poll.mts).
on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Israel
    - cron: "0 18 * * *"  # 21:00 Israel, after the evening TV polls
  workflow_dispatch:
    inputs:
      pollster:
        description: "Exit poll by hand: the channel (Kan 11, Channel 12, Channel 13, Channel 14). Leave empty to run the Wikipedia import."
        type: string
        default: ""
      seats:
        description: "Its seats as id=seats, comma-separated: likud=30,yashar=20,shas=9,..."
        type: string
        default: ""
      url:
        description: "Link to the channel's report (optional)"
        type: string
        default: ""

concurrency:
  group: polls
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEW_BRANCH: polls/review
    steps:
      - name: Automatic acquisition stops at polls close; signed cycles take over
        id: window
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$MANUAL" = true ] || [ "$(date -u +%s)" -lt "$(date -u -d '2026-10-27T20:00:00Z' +%s)" ]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.window.outputs.allowed == 'true'
      - uses: actions/setup-node@v5
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund  # not `npm ci`: lockfiles written on Windows drop Linux-only optional deps (npm bug)
        if: steps.window.outputs.allowed == 'true'

      - name: Exit poll by hand
        if: steps.window.outputs.allowed == 'true' && (inputs.pollster != '')
        env:
          POLLSTER: ${{ inputs.pollster }}
          SEATS: ${{ inputs.seats }}
          URL: ${{ inputs.url }}
        run: |
          npx tsx scripts/jobs/add-exit-poll.mts --pollster "$POLLSTER" --seats "$SEATS" ${URL:+--url "$URL"} | tee "$RUNNER_TEMP/report.md"
          echo "accepted=$(git diff --quiet data/polls.json && echo 0 || echo 1)" >> "$GITHUB_OUTPUT"
        id: manual

      - name: Import and validate
        if: steps.window.outputs.allowed == 'true' && (inputs.pollster == '')
        id: job
        run: npx tsx scripts/jobs/update-polls.mts --report "$RUNNER_TEMP/report.md"

      - name: Campaign forecast write window
        if: steps.window.outputs.allowed == 'true'
        id: campaign
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'open='+(Date.now()<Date.parse('2026-10-27T20:00:00Z'))+'\n')"

      - name: Regenerate the forecast on the new polls
        # scripts/forecast/forecast.mjs: refuses to run once data/forecast.json is marked final, so exit polls never change the prediction.
        if: steps.window.outputs.allowed == 'true' && (steps.job.outputs.accepted != '0' && steps.campaign.outputs.open == 'true')
        run: npm run forecast

      - name: Gate (tests and build on the new data)
        if: steps.window.outputs.allowed == 'true' && (steps.job.outputs.accepted != '0' || steps.manual.outputs.accepted == '1')
        run: npm test && npm run build

      - name: Commit accepted polls
        if: steps.window.outputs.allowed == 'true' && (steps.job.outputs.accepted != '0' || steps.manual.outputs.accepted == '1')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polls.json data/forecast.json data/forecast-v2.json data/forecast-history.json
          msg="${{ steps.manual.outputs.accepted == '1' && 'polls: exit poll entered by hand' || format('polls: add {0} from Wikipedia', steps.job.outputs.accepted) }}"
          git commit -m "$msg" -m "$(cat "$RUNNER_TEMP/report.md")"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Open or update the review PR
        if: steps.window.outputs.allowed == 'true' && (steps.job.outputs.review != '0' || steps.job.outputs.blockers != '0')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$REVIEW_BRANCH"
          git checkout HEAD -- data/polls.json
          npx tsx scripts/jobs/update-polls.mts --include-review --report "$RUNNER_TEMP/review.md"
          git add data/polls.json
          git commit --allow-empty -m "polls: proposed for review" -m "$(cat "$RUNNER_TEMP/review.md")"
          git push --force origin "$REVIEW_BRANCH"
          title="Polls to review ($(date -u +%Y-%m-%d))"
          if gh pr view "$REVIEW_BRANCH" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$REVIEW_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/review.md"
          else
            gh pr create --head "$REVIEW_BRANCH" --base main --title "$title" --body-file "$RUNNER_TEMP/review.md" --assignee RavBogard
          fi
