name: Save election count
on:
  # Automatic count acquisition now uses coordinated QStash cycles. Manual archive recovery remains.
  workflow_dispatch:
# The one place the window is set (count-capture.yml carries the same pair).
env:
  COUNT_WINDOW_START: "2026-10-27T20:00:00Z"
  COUNT_WINDOW_END: "2026-11-08T00:00:00Z"
concurrency:
  group: results-snapshot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Bound automatic runs to the election period
        id: window
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          start=$(date -u -d "$COUNT_WINDOW_START" +%s)
          end=$(date -u -d "$COUNT_WINDOW_END" +%s)
          now=$(date -u +%s)
          if [ "$now" -ge "$start" ] && { [ "$MANUAL" = 'true' ] || [ "$now" -le "$end" ]; }; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.window.outputs.allowed == 'true'
      - uses: actions/setup-node@v5
        if: steps.window.outputs.allowed == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install job dependencies
        if: steps.window.outputs.allowed == 'true'
        run: npm install --no-audit --no-fund  # not `npm ci`: lockfiles written on Windows drop Linux-only optional deps (npm bug)
      - name: Acquire fresh validated count
        if: steps.window.outputs.allowed == 'true'
        id: capture
        run: npx tsx scripts/jobs/results-snapshot.mts
      - name: Verify capture helpers
        if: steps.capture.outputs.changed == 'true'
        run: npx vitest run lib/results.test.ts lib/results-live.test.ts lib/results-snapshot.test.ts lib/results-summary.test.ts
      - name: Persist a distinct count
        if: steps.capture.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/results-snapshot.json
          git commit -m 'results: save validated count'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
